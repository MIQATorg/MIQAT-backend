# backend/sqlc.yaml
version: "2"
sql:
  - engine: postgresql
    schema: database/migrations
    queries: database/queries
    gen:
      go:
        package: db
        out: database/db
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
