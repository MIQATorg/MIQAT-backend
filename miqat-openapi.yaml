      tags:
      - Labels
      description: "Idempotent: attaching an already-attached label returns 204. Bumps the task's sync version."
      parameters:
      - $ref: '#/components/parameters/taskId'
      - $ref: '#/components/parameters/labelId'
      responses:
        '204':
