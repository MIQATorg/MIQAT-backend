        format: uuid
    labelId:
      name: label
      in: path
      required: true
      description: Label UUID.
      schema:
        type: string
        format: uuid
    sessionId:
      name: session
      in: path
      required: true
      description: Work-session UUID.
      schema:
        type: string
        format: uuid
    timeEntryId:
      name: timeEntry
      in: path
      required: true
      description: Time-entry UUID.
      schema:
        type: string
        format: uuid
    templateId:
      name: template
      in: path
      required: true
      description: Time-block template UUID.
      schema:
        type: string
        format: uuid
    locationId:
      name: location
      in: path
      required: true
      description: Location UUID.
      schema:
        type: string
        format: uuid
    detectionRuleId:
      name: detectionRule
      in: path
      required: true
      description: Detection-rule UUID.
      schema:
        type: string
        format: uuid
    groupId:
      name: group
      in: path
      required: true
      description: Group UUID.
      schema:
        type: string
        format: uuid
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque cursor from the previous page. Omit on the first page.
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    from:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: started_at >= from.
    to:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: started_at < to.
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Client-generated UUID. A repeated key replays the stored response.
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: not_found
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    UserRole:
      type: string
      enum:
      - user
      - admin
    Platform:
      type: string
      enum:
      - android
      - ios
      - web
      - linux
      - windows
    EntryKind:
      type: string
      enum:
      - work
      - break
    StopReason:
      type: string
      enum:
      - manual
      - task_switch
      - task_completed
      - idle_timeout
      - session_ended
      - auto_stop
      - detection
      - phase_complete
      description: "manual: user stopped it. task_switch: switched task. task_completed: task was completed. idle_timeout:
        stopped after inactivity. session_ended: parent session ended. auto_stop: hit auto_stop_after_minutes. detection:
        a detection rule's stop action. phase_complete: a Pomodoro phase ended."
    DetectionAction:
      type: string
      enum:
      - start
      - stop
    ActivityStatus:
      type: string
      enum:
      - walking
      - stationary
    IdleAction:
      type: string
      enum:
      - prompt
      - pause
      description: 'prompt: keep running and ask on return. pause: pause automatically and flag the entry for review.'
    ParallelTimerAction:
      type: string
      enum:
      - ask
      - run_both
      - pause_others
    MemberRole:
      type: string
      enum:
      - owner
      - member
