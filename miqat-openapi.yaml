openapi: 3.0.3
info:
  title: MIQAT API
  version: 1.0.0
  description: "Design-first REST API contract for MIQAT, an offline-first, self-hostable time-tracking application.\n\n##
    Conventions\n\n- IDs are UUIDv7. Clients generate them for synced resources and send `id` on create; repeating a create
    with the\n  same `id` and content returns the existing resource. Groups are the exception: the server generates their
    ids.\n- Timestamps are RFC 3339 in UTC.\n- Each resource has three request shapes: `<X>Create` (POST: id + fields), `<X>Fields`
    (PUT: full replace; omitted\n  optional fields reset to their defaults) and `<X>Patch` (PATCH: only supplied fields change;
    `null` clears).\n  Server-managed fields (`user_id`, `created_at`, `updated_at`, `deleted_at`, parent ids) appear only
    in responses.\n- Deletes are soft deletes that create tombstones for sync. Deleting a project deletes its tasks; deleting
    a work\n  session deletes its time entries.\n- List endpoints use opaque cursor pagination (`cursor`, `limit`) and return
    `items` and `next_cursor`.\n- PATCH and POST actions (stop, end, join, create group) require an `Idempotency-Key` header.\n\
    - Sync pulls changes by the server-assigned `server_version`; `410 Gone` when the cursor is older than the 90-day\n  tombstone
    window.\n- Rate-limit tiers (provisional): Light ~300/min, Moderate ~60/min, Severe ~5/min, per account (per IP for auth).\n"
servers:
- url: /api/v1
  description: API base path (adjust to deployment)
tags:
- name: Auth
- name: Projects
- name: Tasks
- name: Labels
- name: Work sessions
- name: Time entries
- name: Time-blocking templates
- name: Detection
- name: Groups
- name: Settings
- name: Sync
- name: Operational
paths:
  /auth/register:
    post:
      operationId: register
      summary: Register
      tags:
      - Auth
      description: Create a local account (hashed password) and log this device in. 409 if the username is taken. Also 
        creates the user's settings row with defaults.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security: []
      x-rate-limit-tier: Severe
      x-rate-limit-requests-per-minute: 5
  /auth/login:
    post:
      operationId: login
      summary: Log in
      tags:
      - Auth
      description: Exchange username and password for a bearer token. Creates a login session for this device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security: []
      x-rate-limit-tier: Severe
      x-rate-limit-requests-per-minute: 5
  /auth/logout:
    post:
      operationId: logout
      summary: Log out this device
      tags:
      - Auth
      description: Revoke the access token used for this request (sets login_sessions.revoked_at). Repeating returns 
        401.
      responses:
        '204':
          description: Successful response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
      - BearerAuth: []
      x-rate-limit-tier: Light
      x-rate-limit-requests-per-minute: 300
