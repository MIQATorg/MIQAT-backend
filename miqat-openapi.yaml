          allOf:
          - $ref: '#/components/schemas/ActivityStatus'
          nullable: true
          default: null
    DetectionRulePatch:
      type: object
      description: 'Partial update: only supplied properties change.'
      minProperties: 1
      properties:
        action:
          $ref: '#/components/schemas/DetectionAction'
        project_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
          nullable: true
          description: Must belong to project_id.
        is_enabled:
          type: boolean
        min_speed:
          type: number
          format: float
          minimum: 0
          nullable: true
          description: m/s.
        wifi:
          type: boolean
          nullable: true
          description: Wi-Fi on (true) or off (false).
        wifi_ssid:
          type: string
          nullable: true
          description: Network name. Not allowed when wifi is false.
        location_id:
          type: string
          format: uuid
          nullable: true
          description: Set together with radius_meter.
        radius_meter:
          type: integer
          minimum: 1
          nullable: true
          description: Set together with location_id.
        activity_status:
          allOf:
          - $ref: '#/components/schemas/ActivityStatus'
          nullable: true
    DetectionRuleCreate:
      allOf:
      - type: object
        required:
        - id
        properties:
          id:
            type: string
            format: uuid
            description: Client-generated UUIDv7.
      - $ref: '#/components/schemas/DetectionRuleFields'
    DetectionRule:
      allOf:
      - $ref: '#/components/schemas/DetectionRuleFields'
      - type: object
        required:
        - id
        - user_id
        - created_at
        - updated_at
        - action
        - project_id
        - task_id
        - is_enabled
        - min_speed
        - wifi
        - wifi_ssid
        - location_id
        - radius_meter
        - activity_status
        - deleted_at
        properties:
          id:
            type: string
            format: uuid
            description: UUIDv7.
          user_id:
            type: string
            format: uuid
            description: Owner; set by the server from the access token.
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
            description: Set by the server on every write.
          deleted_at:
            type: string
            format: date-time
            nullable: true
            description: Non-null on tombstones; normal reads never return deleted rows.
      description: 'All set conditions must match for the action to fire. Validated by the API (400): at least one condition
        (min_speed, wifi, wifi_ssid, location_id, activity_status) is set; location_id and radius_meter are both set or both
        null; wifi_ssid is null when wifi is false; task_id belongs to project_id.'
    DetectionRulePage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DetectionRule'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor; null when no more pages.
    GroupFields:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: BUE study group
    GroupPatch:
      type: object
      description: 'Partial update: only supplied properties change.'
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: BUE study group
    Group:
      allOf:
      - $ref: '#/components/schemas/GroupFields'
      - type: object
        required:
        - id
        - created_at
        - updated_at
        - invite_code
        - my_role
        - name
        - deleted_at
        properties:
          id:
            type: string
            format: uuid
            description: UUIDv7.
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
            description: Set by the server on every write.
          deleted_at:
            type: string
            format: date-time
            nullable: true
            description: Non-null on tombstones; normal reads never return deleted rows.
          invite_code:
            type: string
            description: Share to let others join.
          my_role:
            $ref: '#/components/schemas/MemberRole'
    GroupPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor; null when no more pages.
    GroupMember:
      type: object
      required:
      - user_id
      - display_name
      - role
      - joined_at
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/MemberRole'
        joined_at:
          type: string
          format: date-time
    GroupMemberPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GroupMember'
        next_cursor:
          type: string
          nullable: true
    JoinGroupRequest:
      type: object
      required:
      - invite_code
      properties:
        invite_code:
          type: string
          minLength: 1
    SettingsFields:
      type: object
      properties:
        timezone:
          type: string
          default: UTC
          example: Africa/Cairo
          description: IANA time zone name.
        week_start:
          type: integer
          minimum: 0
          maximum: 6
          default: 6
          description: 0 = Monday ... 6 = Sunday.
        language:
          type: string
          default: en
          description: Language of server-generated text (e.g. push notifications).
        parallel_timer_action:
          allOf:
          - $ref: '#/components/schemas/ParallelTimerAction'
          default: ask
        detection_parallel_timer_action:
          allOf:
          - $ref: '#/components/schemas/ParallelTimerAction'
          default: run_both
        long_timer_reminder_minutes:
          type: integer
          minimum: 1
          nullable: true
          default: 180
          description: Remind on all devices when a timer runs this long. null = off.
        idle_threshold_minutes:
          type: integer
          minimum: 1
          nullable: true
          default: null
          description: Minutes without activity that count as idle. null = idle detection off.
        idle_action:
          allOf:
          - $ref: '#/components/schemas/IdleAction'
          default: prompt
        auto_stop_after_minutes:
          type: integer
          minimum: 1
          nullable: true
          default: null
          description: 'Hard limit: stop any timer running this long. null = off.'
        not_tracking_reminder:
          type: boolean
          default: true
          description: Remind if nothing is tracked during active hours.
        active_hours_start:
          type: integer
          minimum: 0
          maximum: 1439
          nullable: true
          default: 540
          description: Minutes after local midnight (540 = 09:00).
        active_hours_end:
          type: integer
          minimum: 0
          maximum: 1439
          nullable: true
          default: 1020
          description: Minutes after local midnight (1020 = 17:00).
        active_days:
          type: integer
          minimum: 0
          maximum: 127
          default: 79
          description: 'Bitmask: bit 0 = Monday ... bit 6 = Sunday.'
        auto_start_breaks:
          type: boolean
          default: true
        auto_start_next_work:
          type: boolean
          default: false
        notify_phase_end:
          type: boolean
          default: true
          description: Push when a Pomodoro phase or countdown ends.
        quiet_hours_start:
          type: integer
          minimum: 0
          maximum: 1439
          nullable: true
          default: null
          description: Minutes after local midnight; no pushes between start and end. null = off.
        quiet_hours_end:
          type: integer
          minimum: 0
          maximum: 1439
          nullable: true
          default: null
          description: Minutes after local midnight.
        share_running_timer:
          type: boolean
          default: false
          description: Group members can see what I am tracking now.
        client_prefs:
          type: object
          additionalProperties: true
          nullable: true
          default: null
          description: Client-only cosmetic prefs (theme, default screen). Last write wins.
    SettingsPatch:
      type: object
      description: 'Partial update: only supplied properties change.'
      minProperties: 1
      properties:
        timezone:
          type: string
          example: Africa/Cairo
          description: IANA time zone name.
        week_start:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Monday ... 6 = Sunday.
        language:
          type: string
          description: Language of server-generated text (e.g. push notifications).
        parallel_timer_action:
          allOf:
          - $ref: '#/components/schemas/ParallelTimerAction'
        detection_parallel_timer_action:
          allOf:
          - $ref: '#/components/schemas/ParallelTimerAction'
        long_timer_reminder_minutes:
          type: integer
          minimum: 1
          nullable: true
          description: Remind on all devices when a timer runs this long. null = off.
        idle_threshold_minutes:
          type: integer
          minimum: 1
          nullable: true
          description: Minutes without activity that count as idle. null = idle detection off.
        idle_action:
          allOf:
          - $ref: '#/components/schemas/IdleAction'
        auto_stop_after_minutes:
          type: integer
          minimum: 1
          nullable: true
          description: 'Hard limit: stop any timer running this long. null = off.'
        not_tracking_reminder:
          type: boolean
          description: Remind if nothing is tracked during active hours.
        active_hours_start:
          type: integer
          minimum: 0
          maximum: 1439
          nullable: true
          description: Minutes after local midnight (540 = 09:00).
        active_hours_end:
          type: integer
          minimum: 0
          maximum: 1439
          nullable: true
          description: Minutes after local midnight (1020 = 17:00).
        active_days:
          type: integer
          minimum: 0
          maximum: 127
          description: 'Bitmask: bit 0 = Monday ... bit 6 = Sunday.'
        auto_start_breaks:
          type: boolean
        auto_start_next_work:
          type: boolean
        notify_phase_end:
          type: boolean
          description: Push when a Pomodoro phase or countdown ends.
        quiet_hours_start:
          type: integer
          minimum: 0
          maximum: 1439
          nullable: true
          description: Minutes after local midnight; no pushes between start and end. null = off.
        quiet_hours_end:
          type: integer
          minimum: 0
          maximum: 1439
          nullable: true
          description: Minutes after local midnight.
        share_running_timer:
          type: boolean
          description: Group members can see what I am tracking now.
        client_prefs:
          type: object
          additionalProperties: true
          nullable: true
          description: Client-only cosmetic prefs (theme, default screen). Last write wins.
    Settings:
      allOf:
      - $ref: '#/components/schemas/SettingsFields'
      - type: object
        required:
        - timezone
        - week_start
        - language
        - parallel_timer_action
        - detection_parallel_timer_action
        - long_timer_reminder_minutes
        - idle_threshold_minutes
        - idle_action
        - auto_stop_after_minutes
        - not_tracking_reminder
        - active_hours_start
        - active_hours_end
        - active_days
        - auto_start_breaks
        - auto_start_next_work
        - notify_phase_end
        - quiet_hours_start
        - quiet_hours_end
        - share_running_timer
        - client_prefs
        - updated_at
        properties:
          updated_at:
            type: string
            format: date-time
    SyncEntityType:
      type: string
      enum:
      - project
      - task
      - label
      - work_session
      - time_entry
      - time_block_template
      - location
      - detection_rule
      - group
      - settings
    SyncChange:
      type: object
      required:
      - server_version
      - entity_type
      - id
      - operation
      - data
      properties:
        server_version:
          type: integer
          format: int64
          minimum: 0
        entity_type:
          $ref: '#/components/schemas/SyncEntityType'
        id:
          type: string
          description: Resource UUID; for settings, the user id.
        operation:
          type: string
          enum:
          - upsert
          - delete
          description: 'delete = tombstone: remove it from active lists but keep it for history.'
        data:
          type: object
          additionalProperties: true
          description: The same representation the resource's GET returns (entity_type tells which schema). Tombstones 
            also carry it, with deleted_at set, so clients can still label history (e.g. time entries of a deleted 
            project).
    SyncPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
        next_cursor:
          type: integer
          format: int64
          nullable: true
          description: server_version to pass as `since` next; null when caught up.
    HealthResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          example: ok
    DebugHealthResponse:
      type: object
      required:
      - status
      - database
      - version
      - uptime_seconds
      properties:
        status:
          type: string
        database:
          type: object
          additionalProperties: true
        version:
          type: string
        uptime_seconds:
          type: number
          minimum: 0
  responses:
    BadRequest:
      description: Malformed request or failed validation (including cross-resource rules).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, expired or revoked token, or wrong credentials on login.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not allowed (not owner, not admin, wrong invite code).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found, deleted, or not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicts with current state (reused id with different content, taken username, owner leaving, 
        location still in use).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Gone:
      description: '`since` predates the 90-day tombstone window; wipe local data and do a full sync.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until retry.
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

