      description: Full replacement of the writable fields. Omitted optional fields reset to their defaults.
      parameters:
      - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectFields'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
      - BearerAuth: []
      x-rate-limit-tier: Light
      x-rate-limit-requests-per-minute: 300
    patch:
      operationId: patchProject
      summary: Modify project
      tags:
      - Projects
      description: 'Partial update: only supplied fields change. Send `null` to clear a nullable field.'
      x-idempotency:
        header: Idempotency-Key
        behavior: Replay the stored response for a repeated key.
      parameters:
      - $ref: '#/components/parameters/projectId'
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatch'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
      - BearerAuth: []
      x-rate-limit-tier: Light
      x-rate-limit-requests-per-minute: 300
    delete:
      operationId: deleteProject
      summary: Delete project
      tags:
      - Projects
      description: Soft-delete the project, its tasks and its detection rules; emits tombstones for each. Work sessions 
        and time entries are kept as history and still reference the deleted project and tasks. New sessions, tasks and 
        rules on a deleted project return 404. Repeating the delete returns 204.
      parameters:
      - $ref: '#/components/parameters/projectId'
      responses:
        '204':
          description: Successful response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
