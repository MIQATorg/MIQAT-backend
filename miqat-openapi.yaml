      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      security:
      - BearerAuth: []
      x-rate-limit-tier: Light
      x-rate-limit-requests-per-minute: 300
    patch:
      operationId: patchTask
      summary: Modify task
      tags:
      - Tasks
      description: 'Partial update: only supplied fields change. Send `null` to clear a nullable field.'
      x-idempotency:
        header: Idempotency-Key
        behavior: Replay the stored response for a repeated key.
      parameters:
      - $ref: '#/components/parameters/taskId'
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
